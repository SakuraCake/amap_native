name: amap_native_android
description: Android implementation of the amap_native Flutter plugins using the native AMap SDK.
version: 0.1.2
repository: https://github.com/SakuraCake/amap_native

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  amap_native_core: ^0.1.0
  amap_native_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ink.qichen.amap_native
        pluginClass: AmapNativePlugin
        dartPluginClass: AmapNativeAndroid
