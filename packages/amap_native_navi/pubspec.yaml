name: amap_native_navi
description: AMap native turn-by-turn navigation view and controller for Flutter.
version: 0.1.3
repository: https://github.com/SakuraCake/amap_native

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  amap_native_core: ^0.1.0
  amap_native_platform_interface: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        dartPluginClass: AmapNaviPlugin
