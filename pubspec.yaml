name: amap_native_workspace
description: Workspace for the amap_native Flutter plugin packages.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

workspace:
  - packages/*
  - example

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^8.0.0

melos:
  scripts:
    analyze:
      run: flutter analyze packages example
    test:
      run: flutter test packages/amap_native_core packages/amap_native_map
    format:
      run: dart format --output=none --set-exit-if-changed packages example
    build:example:
      run: cd example && flutter build apk --debug
